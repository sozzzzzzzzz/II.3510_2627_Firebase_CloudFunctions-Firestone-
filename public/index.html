<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwapCampus · Démo Firebase</title>
<link rel="stylesheet" href="./style.css">
<main>
  <header><p class="brand">SwapCampus</p><h1>Les annonces du campus</h1><p id="connection" role="status">Connexion aux émulateurs…</p></header>
  <section aria-labelledby="publish"><h2 id="publish">Déposer une annonce</h2>
    <form id="listing-form">
      <label>Titre<input name="title" required maxlength="100" placeholder="Calculatrice TI"></label>
      <label>Prix en euros<input name="price" required type="number" min="0" max="1000" step="0.01" placeholder="12.50"></label>
      <button disabled>Déposer</button>
    </form>
    <p id="feedback" role="status"></p>
  </section>
  <div class="columns">
    <section><h2>Annonces publiées</h2><ul id="feed"></ul></section>
    <section><h2>Mes annonces</h2><ul id="mine"></ul></section>
  </div>
  <section><h2>Mes notifications</h2><ul id="inbox" aria-live="polite"></ul></section>
</main>
<script type="module" src="./app.js"></script>
</html>
